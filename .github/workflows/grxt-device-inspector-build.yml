name: GRXT Device Inspector Build

on:
  push:
    branches: ["build/grxt-device-inspector-v0.1"]
    paths:
      - "grxt-device-inspector/**"
      - ".github/workflows/grxt-device-inspector-build.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "grxt-device-inspector/**"
      - ".github/workflows/grxt-device-inspector-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        working-directory: grxt-device-inspector
        run: gradle :app:assembleDebug --stacktrace
      - name: Build Magisk module
        run: |
          set -eux
          OUT="$GITHUB_WORKSPACE/out"
          MOD="$OUT/module"
          mkdir -p "$MOD/system/app/GRXTDeviceInspector"
          cp grxt-device-inspector/app/build/outputs/apk/debug/app-debug.apk "$MOD/system/app/GRXTDeviceInspector/GRXTDeviceInspector.apk"
          cat > "$MOD/module.prop" <<'EOF'
          id=grxt_device_inspector
          name=GRXT Device Inspector
          version=0.1.0
          versionCode=1
          author=GRXT
          description=Installs GRXT Device Inspector as a system app. Device, battery, kernel, RAM, storage and diagnostics information.
          EOF
          cat > "$MOD/customize.sh" <<'EOF'
          ui_print "*******************************"
          ui_print " GRXT Device Inspector v0.1.0 "
          ui_print "*******************************"
          ui_print "Installing system app..."
          set_perm_recursive "$MODPATH/system" 0 0 0755 0644
          ui_print "Done. Reboot the device."
          EOF
          cat > "$MOD/service.sh" <<'EOF'
          #!/system/bin/sh
          sleep 8
          chmod 0644 /system/app/GRXTDeviceInspector/GRXTDeviceInspector.apk 2>/dev/null || true
          EOF
          chmod 0755 "$MOD/customize.sh" "$MOD/service.sh"
          cd "$MOD"
          zip -r9 "$OUT/GRXT-Device-Inspector-Magisk-v0.1.0.zip" .
          cp system/app/GRXTDeviceInspector/GRXTDeviceInspector.apk "$OUT/GRXT-Device-Inspector-v0.1.0.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: GRXT-Device-Inspector-v0.1.0
          path: out/*
          retention-days: 7
