name: Build GRXT Mobile v0.5.0

on:
  push:
    branches:
      - grxt-mobile-build-v05
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack source
        run: |
          rm -rf project
          mkdir project
          unzip -q grxt-mobile-v05-source.zip -d project

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Install Android SDK 37
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk GRXT_Mobile_v0.5.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GRXT-Mobile-v0.5.0
          path: GRXT_Mobile_v0.5.0.apk
          if-no-files-found: error
          retention-days: 1
